services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: banco
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - banco
    security_opt:
      - no-new-privileges:true
    cpus: "0.50"
    mem_limit: 256m

  banco:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # sem "ports", assim só o app acessa o banco
    security_opt:
      - no-new-privileges:true
    cpus: "1.0"
    mem_limit: 512m