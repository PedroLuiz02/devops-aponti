name: "Minha pipeline"

on:
  push:
    branches: [main, developer]
    paths:
      - "pipeline-jenkins-nodejs/**"

jobs:
  meu-job:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: pipeline-jenkins-nodejs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacao de dependencias
        run: "npm install"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test