name: "Minha pipeline"

on:
  push:
    branches: [main, developer]

jobs:
  meu-job:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v7

      - name: Instalacao de dependencias
        run: "npm install"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test