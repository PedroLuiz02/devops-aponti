name: Pipeline GitHub Secrets

on:
  push:
    branches:
      - main
    paths:
      - "github-secrets-demo/**"
      - ".github/workflows/main_secrets.yml"

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          cd github-secrets-demo/app
          npm install

      - name: Executar aplicação
        env:
          MENSAGEM_SECRETA: ${{ secrets.MENSAGEM_SECRETA }}
        run: |
          cd app
          node server.js




